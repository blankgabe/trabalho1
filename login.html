<html>

<head>
    <title>Loja</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>


<body>
    <header>
        <div id="header">

            <div id="logo">
                <a href="index.html">
                    <img src="assets/logo megalofds.png" alt="Logo">
                </a>
            </div>

            <nav id="menu">
                <details class="dropdown">
                    <summary>Coleções <span class="seta">▼</span></summary>

                    <div class="submenu">
                        <a href="colecaofrutas.html">Las frutitas</a>
                        <a href="colecaodavibrito.html">Calma calabreso</a>
                        <a href="colecaoishowspeed.html">Say walahi</a>
                        <a href="colecaobangers.html">Bangers</a>
                    </div>
                </details>

                <a href="catalogo.html">Catalogo</a>
            </nav>

            <div id="icons">
                <span class="material-icons">search</span>
                <a href="login.html"><span class="material-icons">person</span></a>

                <button id="abrir-carrinho">
                    <span class="material-icons">shopping_bag</span>
                    <span id="contador-carrinho">0</span>
                </button>
            </div>

        </div>
    </header>
    <main>
        <div id="preencherlogin">Preencha com seus dados abaixo para criar sua conta</div>
        <form id="formLogin">
            <fieldset>
                <legend>Dados Pessoais</legend>
                Nome: <input type="text" id="nome" name="nome" placeholder="Informe o seu nome" autofocus required>
                <br><br>
                Cpf: <input type="text" id="cpf" name="cpf" placeholder="Informe o seu cpf" maxlength="14"
                    pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" required> <br><br>
                Email: <input type="email" id="email" name="email" placeholder="Informe seu email" required> <br><br>
                Senha: <input type="password" id="senha" name="senha" placeholder="Informe uma senha" minlength="5"
                    required> <br>
            </fieldset>
            <fieldset>
                <legend>Endereço</legend>
                Estado: <select name="estado" id="estado">
                    <option value="acre">Acre (AC)</option>
                    <option value="alagoas">Alagoas (AL)</option>
                    <option value="amapa">Amapá (AP)</option>
                    <option value="amazonas">Amazonas (AM)</option>
                    <option value="bahia">Bahia (BA)</option>
                    <option value="ceara">Ceará (CE)</option>
                    <option value="distrito-federal">Distrito Federal (DF)</option>
                    <option value="espirito-santo">Espírito Santo (ES)</option>
                    <option value="goias">Goiás (GO)</option>
                    <option value="maranhao">Maranhão (MA)</option>
                    <option value="mato-grosso">Mato Grosso (MT)</option>
                    <option value="mato-grosso-do-sul">Mato Grosso do Sul (MS)</option>
                    <option value="minas-gerais">Minas Gerais (MG)</option>
                    <option value="para">Pará (PA)</option>
                    <option value="paraiba">Paraíba (PB)</option>
                    <option value="parana">Paraná (PR)</option>
                    <option value="pernambuco">Pernambuco (PE)</option>
                    <option value="piaui">Piauí (PI)</option>
                    <option value="rio-de-janeiro">Rio de Janeiro (RJ)</option>
                    <option value="rio-grande-do-norte">Rio Grande do Norte (RN)</option>
                    <option value="rio-grande-do-sul">Rio Grande do Sul (RS)</option>
                    <option value="rondonia">Rondônia (RO)</option>
                    <option value="roraima">Roraima (RR)</option>
                    <option value="santa-catarina">Santa Catarina (SC)</option>
                    <option value="sao-paulo">São Paulo (SP)</option>
                    <option value="sergipe">Sergipe (SE)</option>
                    <option value="tocantins">Tocantins (TO)</option>
                </select>
                Cidade: <input type="text" id="cidade" name="cidade" placeholder="Informe a sua cidade" required>
                Rua: <input type="text" id="rua" name="rua" placeholder="Informe a sua rua" required> <br><br>
                CEP: <input type="text" id="cep" name="CEP" placeholder="Informe o seu CEP" maxlength="9"
                    pattern="[0-9]{5}-[0-9]{3}"> <br>
            </fieldset>
            <button type="submit">Criar conta</button>
        </form>
        <div id="mensagem">Nenhum cadastro realizado.</div>
    </main>
    <script>

        const formLogin = document.getElementById("formLogin");
        const mensagem = document.getElementById("mensagem");

        formLogin.addEventListener("submit", function (event) {

            event.preventDefault();

            // Recebe os dados digitados
            const nome = document.getElementById("nome").value;
            const cpf = document.getElementById("cpf").value;
            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value;
            const estado = document.getElementById("estado");
            const cidade = document.getElementById("cidade").value;
            const rua = document.getElementById("rua").value;
            const cep = document.getElementById("cep").value;

            // Cria a mensagem de cadastro
            mensagem.innerHTML = `
            <h2>Cadastro concluído com sucesso!</h2>

            <p>Nome: <span id="nomeCadastrado"></span></p>
            <p>CPF: <span id="cpfCadastrado"></span></p>
            <p>Email: <span id="emailCadastrado"></span></p>
            <p>Estado: <span id="estadoCadastrado"></span></p>
            <p>Cidade: <span id="cidadeCadastrada"></span></p>
            <p>Rua: <span id="ruaCadastrada"></span></p>
            <p>CEP: <span id="cepCadastrado"></span></p>
        `;

            // Insere os dados na página
            document.getElementById("nomeCadastrado").textContent = nome;
            document.getElementById("cpfCadastrado").textContent = cpf;
            document.getElementById("emailCadastrado").textContent = email;
            document.getElementById("estadoCadastrado").textContent = estado.options[estado.selectedIndex].text;
            document.getElementById("cidadeCadastrada").textContent = cidade;
            document.getElementById("ruaCadastrada").textContent = rua;
            document.getElementById("cepCadastrado").textContent = cep;

            // Limpa os campos
            formLogin.reset();

        });

    </script>
</body>

</html>
